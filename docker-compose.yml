services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SIH_SYNC_MINUTES: 5
    volumes:
      - sih_data:/app/data
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    environment:
      VITE_API_URL: http://localhost:8000
volumes:
  sih_data:
